<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>Two-Player Rock Paper Scissors</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#f5f3ff;background:#10111b}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(ellipse at top,#292044,#10111b 70%)}
main{width:min(100%,620px);background:#191a28;border:1px solid #45405e;border-radius:24px;padding:clamp(18px,5vw,32px);box-shadow:0 24px 70px #0007}
h1{text-align:center;font-size:clamp(1.6rem,5vw,2.2rem);margin:0 0 8px}
.subtitle{text-align:center;color:#c2bdd7;margin:0 0 24px}
.topline{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;color:#d7d0ee;font-weight:650}
.scoreboard{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:18px 0}
.score{background:#242538;border-radius:16px;padding:16px;text-align:center}
.score strong{display:block;font-size:2rem;margin-top:4px}
.panel{background:#202132;border:1px solid #393750;border-radius:18px;padding:18px;text-align:center}
#status{font-size:1.12rem;font-weight:750;margin:0 0 8px}
#help{color:#c2bdd7;margin:0 0 16px;line-height:1.5}
.choices{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}
button{font:inherit;font-weight:700;border:1px solid #615583;border-radius:13px;padding:12px 8px;color:#fff;background:#39304f;cursor:pointer;min-height:48px}
button:hover{background:#51416f}
button:focus-visible{outline:3px solid #c7b5ff;outline-offset:3px}
button:disabled{opacity:.45;cursor:not-allowed}
.primary{background:#7955c8;border-color:#9b7be2}
.secondary{margin-top:14px;background:transparent;width:100%}
#result{min-height:30px;margin:16px 0 0;font-size:1.05rem;font-weight:750}
.hidden{display:none!important}
footer{text-align:center;color:#a8a1c0;font-size:.8rem;margin-top:18px}
@media(max-width:390px){.choices{grid-template-columns:1fr}.scoreboard{gap:8px}.score{padding:12px}}
</style>
</head>
<body>
<main>
<h1>✊ Rock Paper Scissors ✌️</h1>
<p class="subtitle">A pass-and-play game for two players</p>
<div class="topline"><span id="round">Round 1</span><span>First to any score wins — or play forever</span></div>
<section class="scoreboard" aria-label="Scoreboard">
<div class="score">Player 1<strong id="score1">0</strong></div>
<div class="score">Player 2<strong id="score2">0</strong></div>
</section>
<section class="panel">
<p id="status" aria-live="polite">Player 1, make your choice</p>
<p id="help">Choose Rock, Paper, or Scissors. Your choice stays hidden until Player 2 finishes.</p>
<div id="choices" class="choices">
<button type="button" data-choice="rock">✊ Rock</button>
<button type="button" data-choice="paper">✋ Paper</button>
<button type="button" data-choice="scissors">✌️ Scissors</button>
</div>
<button id="ready" class="primary hidden" type="button">Pass phone to Player 2</button>
<p id="result" aria-live="polite"></p>
<button id="next" class="primary hidden" type="button">Next round</button>
</section>
<button id="reset" class="secondary" type="button">Reset match</button>
<footer>Two players · One phone · No internet required</footer>
</main>
<script>
(() => {
  const choices = document.getElementById("choices");
  const status = document.getElementById("status");
  const help = document.getElementById("help");
  const ready = document.getElementById("ready");
  const next = document.getElementById("next");
  const result = document.getElementById("result");
  const roundLabel = document.getElementById("round");
  const score1Label = document.getElementById("score1");
  const score2Label = document.getElementById("score2");
  let round = 1, score1 = 0, score2 = 0, phase = 1, choice1 = null;

  function showChoices(enabled) {
    choices.classList.toggle("hidden", !enabled);
    choices.querySelectorAll("button").forEach(button => { button.disabled = !enabled; });
  }
  function choose(move) {
    if (phase === 1) {
      choice1 = move;
      phase = 2;
      showChoices(false);
      status.textContent = "Player 1 has locked in a choice";
      help.textContent = "Pass the phone to Player 2. Player 1's choice stays hidden.";
      ready.classList.remove("hidden");
      ready.textContent = "Player 2 is ready";
      result.textContent = "";
      return;
    }
    if (phase !== 3) return;
    const choice2 = move;
    const labels = {rock:"Rock ✊",paper:"Paper ✋",scissors:"Scissors ✌️"};
    let outcome;
    if (choice1 === choice2) outcome = "It's a draw!";
    else if ((choice1 === "rock" && choice2 === "scissors")
      || (choice1 === "paper" && choice2 === "rock")
      || (choice1 === "scissors" && choice2 === "paper")) {
      score1++; outcome = "Player 1 wins this round!";
    } else {
      score2++; outcome = "Player 2 wins this round!";
    }
    score1Label.textContent = String(score1);
    score2Label.textContent = String(score2);
    status.textContent = outcome;
    help.textContent = "Player 1: " + labels[choice1] + " · Player 2: " + labels[choice2];
    result.textContent = score1 === score2 ? "The match is tied." :
      (score1 > score2 ? "Player 1 leads." : "Player 2 leads.");
    roundLabel.textContent = "Round " + round;
    phase = 4;
    showChoices(false);
    ready.classList.add("hidden");
    next.classList.remove("hidden");
  }
  choices.querySelectorAll("[data-choice]").forEach(button => {
    button.addEventListener("click", () => choose(button.dataset.choice));
  });
  ready.addEventListener("click", () => {
    if (phase !== 2) return;
    phase = 3;
    ready.classList.add("hidden");
    status.textContent = "Player 2, make your choice";
    help.textContent = "Choose Rock, Paper, or Scissors. Then both choices will be revealed.";
    showChoices(true);
  });
  next.addEventListener("click", () => {
    round++;
    phase = 1;
    choice1 = null;
    roundLabel.textContent = "Round " + round;
    status.textContent = "Player 1, make your choice";
    help.textContent = "Choose Rock, Paper, or Scissors. Your choice stays hidden until Player 2 finishes.";
    result.textContent = "";
    next.classList.add("hidden");
    showChoices(true);
  });
  document.getElementById("reset").addEventListener("click", () => {
    round = 1; score1 = 0; score2 = 0; phase = 1; choice1 = null;
    roundLabel.textContent = "Round 1";
    score1Label.textContent = "0";
    score2Label.textContent = "0";
    status.textContent = "Player 1, make your choice";
    help.textContent = "Choose Rock, Paper, or Scissors. Your choice stays hidden until Player 2 finishes.";
    result.textContent = "";
    ready.classList.add("hidden");
    next.classList.add("hidden");
    showChoices(true);
  });
})();
</script>
</body>
</html>
