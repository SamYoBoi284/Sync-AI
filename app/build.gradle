plugins { id 'com.android.application' }

android {
    namespace 'com.sam.syncai'
    compileSdk 35
    ndkVersion '29.0.14206865'

    defaultConfig {
        applicationId 'com.sam.syncai'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '0.2.0'

        ndk {
            abiFilters 'arm64-v8a'
        }

        externalNativeBuild {
            cmake {
                arguments '-DCMAKE_BUILD_TYPE=Release',
                        '-DGGML_NATIVE=OFF',
                        '-DGGML_CPU_ALL_VARIANTS=ON',
                        '-DGGML_OPENMP=OFF',
                        '-DGGML_LLAMAFILE=OFF'
            }
        }
    }

    buildFeatures {
        buildConfig true
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.31.6'
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging true
        }
    }
}
