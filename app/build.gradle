plugins { id 'com.android.application' }

android {
    namespace 'com.sam.syncai'
    compileSdk 35
    ndkVersion '29.0.14206865'

    defaultConfig {
        applicationId 'com.sam.syncai'
        minSdk 26
        targetSdk 35
        versionCode (System.getenv('VERSION_CODE')?.toInteger() ?: 2)
        versionName (System.getenv('VERSION_NAME') ?: '0.2.0')

        ndk {
            abiFilters 'arm64-v8a'
        }

        externalNativeBuild {
            cmake {
                arguments '-DCMAKE_BUILD_TYPE=Release',
                        '-DGGML_NATIVE=OFF',
                        '-DGGML_CPU_ALL_VARIANTS=ON',
                        '-DGGML_OPENMP=OFF',
                        '-DGGML_LLAMAFILE=OFF'
            }
        }
    }

    signingConfigs {
        release {
            storeFile file('release.keystore')
            storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
            keyAlias System.getenv('ANDROID_KEY_ALIAS')
            keyPassword System.getenv('ANDROID_KEY_PASSWORD')
        }
    }

    buildTypes {
        debug {
            // Keep debug installs separate from the production app and its private data.
            // This suffix is deliberately dotless to produce com.sam.syncaitest.
            applicationIdSuffix 'test'
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    buildFeatures {
        buildConfig true
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.31.6'
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging true
        }
    }
}

dependencies {
    implementation 'com.tom-roush:pdfbox-android:2.0.27.0'
    implementation 'com.alphacephei:vosk-android:0.3.75'
    implementation 'androidx.core:core:1.15.0'
}
