name: Build Sync//AI APK

on:
  push:
    branches: [ "main", "native-gguf-chat-ui", "sync-ai-toolcore-voice-history", "sync-ai-context-visual-813e999-v2", "feat/hey-sync-vosk-visual-refresh", "latest-sync-ai-development-branch", "fix/external-voice-handoff-transcripts", "feat/fuzzy-app-launch-wake-toggle", "feat/sync-complete-experience", "fix/generation-timer-alarm-export", "feat/android-auto-updater" ]
  pull_request:
    branches: [ "main", "sync-ai-context-visual-813e999-v2", "latest-sync-ai-development-branch", "feat/sync-complete-experience", "fix/generation-timer-alarm-export" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true

      - name: Install Vulkan shader compiler and SPIR-V CMake package
        run: |
          sudo apt-get update
          sudo apt-get install -y glslc spirv-headers
          # Ubuntu's spirv-headers package provides the headers but not the
          # SPIRV-HeadersConfig.cmake required by llama.cpp's Vulkan backend.
          git clone --depth 1 https://github.com/KhronosGroup/SPIRV-Headers.git "$RUNNER_TEMP/SPIRV-Headers"
          cmake -S "$RUNNER_TEMP/SPIRV-Headers" -B "$RUNNER_TEMP/SPIRV-Headers/build" -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr/local
          cmake --build "$RUNNER_TEMP/SPIRV-Headers/build" --parallel 2
          sudo cmake --install "$RUNNER_TEMP/SPIRV-Headers/build"

      - name: Install Android native toolchain
        run: $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;29.0.14206865" "cmake;3.31.6"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10"

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sync-ai-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
