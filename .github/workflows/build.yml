name: Build Sync//AI APK

on:
  push:
    branches: [ "main", "native-gguf-chat-ui", "sync-ai-toolcore-voice-history", "sync-ai-context-visual-813e999-v2" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply diagnostics export patch
        run: |
          echo '' | base64 -d | gzip -d > /tmp/patch.diff
          git apply /tmp/patch.diff
          python3 - <<'PY'
          from pathlib import Path
          p = Path('CONTEXT_TRACKER.md')
          s = p.read_text()
          marker = '## Chat export — implemented\n'
          section = '''## Full debug log export — implemented\n\nSettings now includes an **Export Logs** action. The export produces one text file containing app/device metadata, runtime diagnostics, latest request diagnostics, every saved chat with per-AI-message diagnostics, and best-effort Android `logcat` output. The existing `SyncAI` assistant lifecycle logs (`onCreate`, `onReady`, `onPrepareToShowSession`, `onShowSessionFailed`, `onLaunchVoiceAssistFromKeyguard`, session/activity lifecycle, launch failures, and crash/FATAL EXCEPTION lines when available) are included without changing the working voice lifecycle code. Android may restrict logcat access for third-party apps, so the export records when logs are unavailable instead of requesting privileged `READ_LOGS`. Existing chat export remains unchanged.\n\n'''
          if '## Full debug log export — implemented' not in s:
              p.write_text(s.replace(marker, section + marker, 1))
          PY
          git show HEAD^:.github/workflows/build.yml > .github/workflows/build.yml
          rm -f .github/workflows/apply-diagnostics-export.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/sam/syncai/MainActivity.java CONTEXT_TRACKER.md .github/workflows/build.yml .github/workflows/apply-diagnostics-export.yml
          git commit -m "feat: add full diagnostics log export [skip ci]"
          git push

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true

      - name: Install Android native toolchain
        run: $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;29.0.14206865" "cmake;3.31.6"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10"

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sync-ai-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
