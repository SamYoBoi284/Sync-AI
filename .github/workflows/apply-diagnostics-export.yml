name: Apply Sync AI diagnostics export

on:
  push:
    branches: ["sync-ai-context-visual-813e999-v2"]

permissions:
  contents: write

jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[sync-diagnostics-patch]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch diagnostics export
        run: |
          python3 - <<'PY'
          from pathlib import Path

          main = Path('app/src/main/java/com/sam/syncai/MainActivity.java')
          s = main.read_text()

          s = s.replace('private static final int REQ_EXPORT_CHAT = 1204;\n', 'private static final int REQ_EXPORT_CHAT = 1204;\n    private static final int REQ_EXPORT_LOGS = 1205;\n')
          s = s.replace('private String pendingChatExport;\n', 'private String pendingChatExport;\n    private String pendingLogExport;\n')

          old = '''        Button about = sectionButton("ABOUT & DIAGNOSTICS", "Version, creators, runtime evidence");
        about.setOnClickListener(v -> showAbout());
        content.addView(about);

        Button models = sectionButton("LOCAL MODELS", "Import, load, inspect, remove");'''
          new = '''        Button about = sectionButton("ABOUT & DIAGNOSTICS", "Version, creators, runtime evidence");
        about.setOnClickListener(v -> showAbout());
        content.addView(about);

        Button exportLogs = sectionButton("EXPORT LOGS", "All chats + diagnostics + assistant lifecycle logs");
        exportLogs.setOnClickListener(v -> exportAllDiagnostics());
        content.addView(exportLogs);

        Button models = sectionButton("LOCAL MODELS", "Import, load, inspect, remove");'''
          if old not in s: raise SystemExit('settings anchor not found')
          s = s.replace(old, new, 1)

          old = '''        if (requestCode == REQ_EXPORT_CHAT && resultCode == RESULT_OK && data != null) {
            Uri uri = data.getData();
            if (uri != null && pendingChatExport != null) writeChatExport(uri, pendingChatExport);
            pendingChatExport = null;
        }
    }
'''
          new = '''        if (requestCode == REQ_EXPORT_CHAT && resultCode == RESULT_OK && data != null) {
            Uri uri = data.getData();
            if (uri != null && pendingChatExport != null) writeChatExport(uri, pendingChatExport);
            pendingChatExport = null;
            return;
        }
        if (requestCode == REQ_EXPORT_LOGS && resultCode == RESULT_OK && data != null) {
            Uri uri = data.getData();
            if (uri != null && pendingLogExport != null) writeChatExport(uri, pendingLogExport);
            pendingLogExport = null;
        }
    }
'''
          if old not in s: raise SystemExit('activity-result anchor not found')
          s = s.replace(old, new, 1)

          anchor = '''    private void exportAllChats() {
        pendingChatExport = formatAllChatsExport(runtime.chatStore().all());
        Intent intent = new Intent(Intent.ACTION_CREATE_DOCUMENT);
        intent.addCategory(Intent.CATEGORY_OPENABLE);
        intent.setType("text/plain");
        intent.putExtra(Intent.EXTRA_TITLE, "sync-ai-chats.txt");
        startActivityForResult(intent, REQ_EXPORT_CHAT);
    }

'''
          addition = '''    private void exportAllDiagnostics() {
        ioExecutor.execute(() -> {
            StringBuilder out = new StringBuilder();
            out.append("SYNC AI — FULL DEBUG EXPORT\\n");
            out.append("===========================\\n\\n");
            out.append("Exported: ").append(formatTimestamp(System.currentTimeMillis())).append('\\n');
            out.append("App: Sync AI\\n");
            out.append("Version: ").append(BuildConfig.VERSION_NAME).append(" (").append(BuildConfig.VERSION_CODE).append(")\\n");
            out.append("Device: ").append(Build.MANUFACTURER).append(' ').append(Build.MODEL).append('\\n');
            out.append("Android: ").append(Build.VERSION.RELEASE).append(" (API ").append(Build.VERSION.SDK_INT).append(")\\n");
            out.append("ABI: ").append(Build.SUPPORTED_ABIS.length == 0 ? "unknown" : Build.SUPPORTED_ABIS[0]).append("\\n\\n");
            out.append("=== RUNTIME DIAGNOSTICS ===\\n");
            try { out.append(runtime.backend().diagnostics()); } catch (Exception e) { out.append("Runtime diagnostics failed: ").append(e).append('\\n'); }
            out.append("\\n\\n=== LATEST REQUEST DIAGNOSTICS ===\\n");
            String latest = latestDiagnostics();
            out.append(latest.isEmpty() ? "No request diagnostics recorded." : latest).append("\\n\\n");
            out.append("=== ALL SAVED CHATS + PER-MESSAGE DIAGNOSTICS ===\\n");
            out.append(formatAllChatsExport(runtime.chatStore().all())).append("\\n\\n");
            out.append("=== ANDROID LOGCAT / ASSISTANT LIFECYCLE ===\\n");
            out.append(captureSyncLogcat());
            out.append("\\n\\n=== END FULL DEBUG EXPORT ===\\n");
            pendingLogExport = out.toString();
            runOnUiThread(() -> {
                Intent intent = new Intent(Intent.ACTION_CREATE_DOCUMENT);
                intent.addCategory(Intent.CATEGORY_OPENABLE);
                intent.setType("text/plain");
                intent.putExtra(Intent.EXTRA_TITLE, "sync-ai-full-debug.txt");
                startActivityForResult(intent, REQ_EXPORT_LOGS);
            });
        });
    }

    private String captureSyncLogcat() {
        StringBuilder out = new StringBuilder();
        String[] commands = {
                "logcat -d -v threadtime --pid=" + android.os.Process.myPid(),
                "logcat -d -v threadtime -s SyncAI:D SyncAI:I SyncAI:W SyncAI:E"
        };
        boolean captured = false;
        for (String command : commands) {
            try {
                Process process = Runtime.getRuntime().exec(command.split(" "));
                java.io.BufferedReader reader = new java.io.BufferedReader(new java.io.InputStreamReader(process.getInputStream(), StandardCharsets.UTF_8));
                String line;
                while ((line = reader.readLine()) != null) out.append(line).append('\\n');
                process.waitFor();
                if (out.length() > 0) { captured = true; break; }
            } catch (Exception ignored) {}
        }
        if (!captured) {
            out.append("Logcat was not readable from the app process on this device.\\n");
            out.append("Use Android Studio/ADB logcat for system-only logs.\\n");
        }
        return out.toString();
    }

'''
          if anchor not in s: raise SystemExit('export anchor not found')
          s = s.replace(anchor, anchor + addition, 1)
          main.write_text(s)

          tracker = Path('CONTEXT_TRACKER.md')
          t = tracker.read_text()
          marker = '## Chat export — implemented\n'
          insert = '''## Full debug log export — implemented\n\nSettings now includes an **Export Logs** action. The export produces one text file containing app/device metadata, runtime diagnostics, latest request diagnostics, every saved chat with per-AI-message diagnostics, and best-effort Android `logcat` output. The existing `SyncAI` assistant lifecycle logs (`onCreate`, `onReady`, `onPrepareToShowSession`, `onShowSessionFailed`, `onLaunchVoiceAssistFromKeyguard`, session/activity lifecycle, launch failures, and crash/FATAL EXCEPTION lines when available) are therefore included without changing the working voice lifecycle code. Android may restrict logcat access for third-party apps, so the export records when logs are unavailable instead of requesting the privileged `READ_LOGS` permission. Existing chat export is unchanged.\n\n'''
          if '## Full debug log export — implemented' not in t:
              t = t.replace(marker, insert + marker, 1)
              tracker.write_text(t)
          PY
          rm -f .github/workflows/apply-diagnostics-export.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/sam/syncai/MainActivity.java CONTEXT_TRACKER.md .github/workflows/apply-diagnostics-export.yml
          git commit -m "feat: add full diagnostics log export [sync-diagnostics-patch]"
          git push
