name: Apply Sync AI diagnostics export

on:
  push:
    branches: ["sync-ai-context-visual-813e999-v2"]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply source patch
        run: |
          cat > /tmp/patch.b64 <<'PATCH'
          U29tZSBub3QtcmVhbCBwYXRjaCBjb250ZW50IGlzIG5vdCB1c2VkLg==
          PATCH
          echo 'The patch workflow is intentionally replaced by the next commit.'
          exit 1
